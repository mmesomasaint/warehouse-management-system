version: '3.8'
services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: springboot-postgres-dev
    environment:
      POSTGRES_DB: my_local_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: my_docker_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
